[project]
name = "io-networks"
version = "0.1.0"
description = "Dissertation pipeline for ICIO input-output networks"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "pyyaml>=6.0",
  "matplotlib>=3.9",
  "adjustText>=1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle errors, pyflakes, import sorting

[project.scripts]
io-net = "io_networks.cli:main"
